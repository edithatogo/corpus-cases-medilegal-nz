name: Mirror Sync

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mirror to Secondary Git Remote
        env:
          GIT_MIRROR_URL: ${{ secrets.GIT_MIRROR_URL }}
          GIT_MIRROR_URL_GITLAB: ${{ secrets.GIT_MIRROR_URL_GITLAB }}
          GIT_MIRROR_URL_CODEBERG: ${{ secrets.GIT_MIRROR_URL_CODEBERG }}
          GIT_MIRROR_SSH_PRIVATE_KEY: ${{ secrets.GIT_MIRROR_SSH_PRIVATE_KEY }}
          GIT_MIRROR_SSH_PRIVATE_KEY_GITLAB: ${{ secrets.GIT_MIRROR_SSH_PRIVATE_KEY_GITLAB }}
          GIT_MIRROR_SSH_PRIVATE_KEY_CODEBERG: ${{ secrets.GIT_MIRROR_SSH_PRIVATE_KEY_CODEBERG }}
        run: |
          declare -A SEEN_MIRROR_URLS=()
          MIRROR_URLS=()
          for MIRROR_URL in "$GIT_MIRROR_URL" "$GIT_MIRROR_URL_GITLAB" "$GIT_MIRROR_URL_CODEBERG"; do
            if [ -n "$MIRROR_URL" ] && [ -z "${SEEN_MIRROR_URLS[$MIRROR_URL]:-}" ]; then
              SEEN_MIRROR_URLS[$MIRROR_URL]=1
              MIRROR_URLS+=("$MIRROR_URL")
            fi
          done

          if [ "${#MIRROR_URLS[@]}" -eq 0 ]; then
            echo "No mirror URLs are set, skipping mirror."
            exit 0
          fi

          if [ -z "$GIT_MIRROR_SSH_PRIVATE_KEY" ] && [ -z "$GIT_MIRROR_SSH_PRIVATE_KEY_GITLAB" ] && [ -z "$GIT_MIRROR_SSH_PRIVATE_KEY_CODEBERG" ]; then
            echo "No mirror SSH private key secrets are set, skipping mirror."
            exit 0
          fi

          mkdir -p ~/.ssh

          FAILURES=0
          for GIT_MIRROR_URL in "${MIRROR_URLS[@]}"; do
            SELECTED_SSH_PRIVATE_KEY="$GIT_MIRROR_SSH_PRIVATE_KEY"
            if [[ "$GIT_MIRROR_URL" == *"gitlab.com"* ]] && [ -n "$GIT_MIRROR_SSH_PRIVATE_KEY_GITLAB" ]; then
              SELECTED_SSH_PRIVATE_KEY="$GIT_MIRROR_SSH_PRIVATE_KEY_GITLAB"
            elif [[ "$GIT_MIRROR_URL" == *"codeberg.org"* ]] && [ -n "$GIT_MIRROR_SSH_PRIVATE_KEY_CODEBERG" ]; then
              SELECTED_SSH_PRIVATE_KEY="$GIT_MIRROR_SSH_PRIVATE_KEY_CODEBERG"
            fi

            if [ -z "$SELECTED_SSH_PRIVATE_KEY" ]; then
              echo "::error::No mirror SSH private key configured for $GIT_MIRROR_URL"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            echo "$SELECTED_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            # Extract host from git@host:user/repo.git
            HOST=$(echo "$GIT_MIRROR_URL" | cut -d'@' -f2 | cut -d':' -f1)
            ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts

            git remote add mirror "$GIT_MIRROR_URL"
            if git push --force --prune mirror HEAD:${{ github.ref }}; then
              MIRROR_HEAD=$(git ls-remote mirror HEAD | cut -f1)
              echo "Mirrored $GIT_MIRROR_URL at $MIRROR_HEAD"
            else
              echo "::error::Mirror push failed for $GIT_MIRROR_URL"
              FAILURES=$((FAILURES + 1))
            fi
            git remote remove mirror
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES mirror target(s) failed"
            exit 1
          fi
