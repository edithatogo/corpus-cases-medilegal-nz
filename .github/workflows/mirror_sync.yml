name: Mirror Sync

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mirror to Secondary Git Remote
        env:
          GIT_MIRROR_URL: ${{ secrets.GIT_MIRROR_URL }}
          GIT_MIRROR_URL_GITLAB: ${{ secrets.GIT_MIRROR_URL_GITLAB }}
          GIT_MIRROR_URL_CODEBERG: ${{ secrets.GIT_MIRROR_URL_CODEBERG }}
          GIT_MIRROR_SSH_PRIVATE_KEY: ${{ secrets.GIT_MIRROR_SSH_PRIVATE_KEY }}
        run: |
          MIRROR_URLS=()
          for MIRROR_URL in "$GIT_MIRROR_URL" "$GIT_MIRROR_URL_GITLAB" "$GIT_MIRROR_URL_CODEBERG"; do
            if [ -n "$MIRROR_URL" ]; then
              MIRROR_URLS+=("$MIRROR_URL")
            fi
          done

          if [ "${#MIRROR_URLS[@]}" -eq 0 ]; then
            echo "No mirror URLs are set, skipping mirror."
            exit 0
          fi

          if [ -z "$GIT_MIRROR_SSH_PRIVATE_KEY" ]; then
            echo "GIT_MIRROR_SSH_PRIVATE_KEY is not set, skipping mirror."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$GIT_MIRROR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          for GIT_MIRROR_URL in "${MIRROR_URLS[@]}"; do
            # Extract host from git@host:user/repo.git
            HOST=$(echo "$GIT_MIRROR_URL" | cut -d'@' -f2 | cut -d':' -f1)
            ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts

            git remote add mirror "$GIT_MIRROR_URL"
            git push --force --prune mirror HEAD:${{ github.ref }}
            git remote remove mirror
          done
