pipeline:
  name: mental_health_review_tribunal
  description: "Mental Health Review Tribunal candidate discovery pipeline"
  source_url: "https://www.health.govt.nz/about-us/new-zealands-health-system/health-system-roles-and-organisations/health-committees-and-boards/mental-health-review-tribunal"
  base_url: "https://www.health.govt.nz/"
  paths:
    raw_dir: "data/raw/candidates/mental_health_review_tribunal"
    processed_dir: "data/processed/candidates"
  scraping:
    page_size: 25
    max_pages: 5
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) NZ-Medicolegal-Corpus-Sync"
    timeout: 30
  validation:
    required_metadata_fields:
      - "case_id"
      - "date"
      - "title"
      - "citation"
      - "url"
  promotion:
    canonical_registry_status: "candidate_only"
    duplicate_strategy: "link_to_official_source_when_duplicate"
    rights_status: "source_terms_review_required_before_canonical_release"
